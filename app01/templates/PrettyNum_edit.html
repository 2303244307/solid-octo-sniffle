{% extends "index_head.html" %}
{% block content %}
    <form method="post" novalidate>
        {% csrf_token %}
        {% for filed in form %}
            <div class="form-group">
                <label for="exampleInputEmail1">{{ filed.label }}</label>
                {{ filed }}
                <div style="color: red;">{{ filed.errors }}</div>
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">修改靓号</button>
    </form>
{% endblock %}
